<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>力兔快跑 | GAI 周延 成都站互动小游戏</title>

    <meta
      name="description"
      content="帮兔子跑过竹林、收满力力币、冲到舞台。2027.1.2 成都东安湖体育公园主体育场 · gai781.top"
    />

    <!-- 社交分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="力兔快跑" />
    <meta property="og:title" content="力兔快跑 | GAI 周延 成都站" />
    <meta
      property="og:description"
      content="帮兔子跑过竹林、收满力力币、冲到舞台。2027.1.2 成都东安湖体育公园主体育场。"
    />
    <meta property="og:image" content="https://gai781.top/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://gai781.top/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="力兔快跑 | GAI 周延 成都站" />
    <meta
      name="twitter:description"
      content="帮兔子跑过竹林、收满力力币、冲到舞台。2027.1.2 成都东安湖体育公园主体育场。"
    />
    <meta name="twitter:image" content="https://gai781.top/og-image.png" />

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050a11;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }

      /* 固定定位铺满可视区，避开 iOS 地址栏把 100vh 算多了的问题 */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* 关键：禁掉浏览器手势，否则按住方向键再点跳跃会被当成缩放/滚动 */
        touch-action: none;
      }

      /* ---------------- 启动页 ---------------- */

      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 16%, #16324a 0%, #0a1420 44%, #04080e 100%);
        color: #e6f0f7;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        transition: opacity 0.35s ease;
        padding: 16px;
        touch-action: manipulation;
        overflow: hidden;
      }

      #start-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .start-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 460px;
        transform-origin: center center;
      }

      /* 小屏 / 横屏时整体再缩一档，保证 logo 和按钮都在屏幕内 */
      @media (max-height: 460px) {
        .start-inner {
          transform: scale(0.82);
        }
      }
      @media (max-height: 360px) {
        .start-inner {
          transform: scale(0.7);
        }
      }

      /* 摇摆的小幽灵兔子 */
      .ghost {
        height: clamp(72px, 19vh, 104px);
        width: auto;
        transform-origin: 50% 92%;
        animation: sway 2.6s ease-in-out infinite;
        filter: drop-shadow(0 6px 18px rgba(255, 236, 186, 0.22));
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-9deg) translateY(2px);
        }
        50% {
          transform: rotate(9deg) translateY(-6px);
        }
      }

      .start-logo {
        width: clamp(96px, 24vw, 128px);
        height: auto;
        margin-top: 6px;
        filter: drop-shadow(0 4px 14px rgba(240, 185, 85, 0.25));
      }

      .start-title {
        margin: 8px 0 0;
        font-size: clamp(20px, 5.4vw, 26px);
        font-weight: 800;
        letter-spacing: 2px;
        color: #f4f8fc;
      }

      .start-sub {
        margin: 6px 0 0;
        font-size: clamp(12px, 3vw, 14px);
        font-weight: 600;
        color: #f0b955;
        letter-spacing: 0.5px;
      }

      .start-desc {
        margin: 8px 0 0;
        font-size: clamp(10px, 2.6vw, 12px);
        color: #93a9bb;
        letter-spacing: 0.5px;
      }

      #start-btn {
        margin-top: 16px;
        width: min(210px, 62vw);
        height: 46px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #f5c66a, #e0a03a);
        color: #201403;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 3px;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 5px 18px rgba(224, 160, 58, 0.3);
        transition:
          transform 0.12s ease,
          opacity 0.2s ease;
      }

      #start-btn:active {
        transform: scale(0.97);
      }

      #start-btn:disabled {
        opacity: 0.72;
        cursor: default;
        box-shadow: none;
      }

      .start-wait {
        margin: 10px 0 0;
        font-size: clamp(10px, 2.5vw, 11px);
        color: #6f8598;
      }

      .start-meta {
        margin: 12px 0 0;
        font-size: clamp(10px, 2.5vw, 11px);
        color: #7d94a8;
        line-height: 1.7;
      }

      .start-domain {
        color: #5f7488;
        letter-spacing: 1px;
      }

      /* 加载中的小转圈 */
      .spinner {
        display: none;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border: 2px solid rgba(32, 20, 3, 0.3);
        border-top-color: #201403;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        vertical-align: -2px;
      }

      #start-screen.loading .spinner {
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------------- 设置面板 ---------------- */

      #settings-panel {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(3, 8, 14, 0.86);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      #settings-panel.show {
        display: flex;
      }

      .settings-card {
        width: min(330px, 84vw);
        background: #121c28;
        border: 1px solid #2b4a3c;
        border-radius: 16px;
        padding: 22px 24px 20px;
        color: #dfe9f2;
      }

      .settings-card h3 {
        margin: 0 0 18px;
        font-size: 17px;
        font-weight: 700;
        color: #eaf6ff;
        text-align: center;
      }

      .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 14px;
        color: #9fb4c6;
        margin-bottom: 10px;
      }

      #pad-size-value {
        color: #f0b955;
        font-weight: 700;
      }

      #pad-size {
        width: 100%;
        accent-color: #f0b955;
        margin: 0 0 22px;
      }

      #settings-close {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #f5c66a, #e0a03a);
        color: #201403;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 2px;
        font-family: inherit;
      }

      /* ---------------- 竖屏提示 ---------------- */

      #rotate-hint {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: #050a11;
        color: #cfe6d6;
        font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
        padding: 32px;
        z-index: 20;
      }

      #rotate-hint .icon {
        font-size: 34px;
      }

      #rotate-hint .skip {
        margin-top: 8px;
        padding: 8px 20px;
        border: 1px solid #2b4a3c;
        border-radius: 999px;
        color: #7fa48c;
        font-size: 13px;
      }

      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint.show {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <!-- 启动页：纯 HTML，首屏立刻可见，不用等 JS 下载完 -->
    <div id="start-screen">
      <div class="start-inner">
        <img class="ghost" src="assets/ghost.png" alt="" />
        <img class="start-logo" src="assets/logo.png" alt="REALG" />
        <h1 class="start-title">力兔快跑</h1>
        <p class="start-sub">GAI 周延 Real G 成都站</p>
        <p class="start-desc">跑过竹林 · 收满力力币 · 冲到舞台</p>

        <button id="start-btn">
          <span class="spinner"></span><span id="start-label">开始游戏</span>
        </button>

        <p class="start-wait">手机第一次打开时间较长，请耐心等待</p>

        <p class="start-meta">
          2027.1.2　成都东安湖体育公园主体育场
          <br />
          <span class="start-domain">gai781.top</span>
        </p>
      </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
      <div class="settings-card">
        <h3>设置</h3>
        <div class="settings-row">
          <span>按键大小</span>
          <span id="pad-size-value">100%</span>
        </div>
        <input type="range" id="pad-size" min="80" max="180" step="10" value="100" />
        <button id="settings-close">完成</button>
      </div>
    </div>

    <!-- 竖屏提示 -->
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div>把手机横过来，<br />体验会好很多</div>
      <div class="skip" id="rotate-skip">仍然继续</div>
    </div>

    <script>
      document.getElementById('rotate-skip').addEventListener('click', function () {
        document.getElementById('rotate-hint').classList.remove('show');
      });
    </script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
